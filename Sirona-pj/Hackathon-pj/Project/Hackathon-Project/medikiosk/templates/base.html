<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediKiosk</title>
  <!-- Local Tailwind copy (works offline). To refresh: wget https://cdn.tailwindcss.com -O static/tailwind.js -->
  <script src="/static/tailwind.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{height:100%;overflow:hidden;background:rgb(2 6 23)}
    ::-webkit-scrollbar{display:none}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .screen-enter{animation:slideUp .35s cubic-bezier(.22,1,.36,1) both}
    @keyframes regionPulse{0%,100%{opacity:.75}50%{opacity:1}}
    .region-selected{animation:regionPulse 1.8s ease-in-out infinite}
    @keyframes tapDemoAnim{
      0%  {transform:translate(0,0) scale(1);opacity:.9}
      30% {transform:translate(0,0) scale(.86);opacity:1}
      50% {transform:translate(55px,28px) scale(1);opacity:.9}
      80% {transform:translate(55px,28px) scale(.86);opacity:1}
      100%{transform:translate(0,0) scale(1);opacity:.9}
    }
    .tutorial-hand{animation:tapDemoAnim 2.8s ease-in-out infinite}
    button:active{transform:scale(.96)}
  </style>
</head>
<body class="text-white h-screen flex flex-col"
      style="touch-action:manipulation;background:linear-gradient(135deg,rgb(2 6 23),rgb(15 23 42),rgb(7 21 46))">

  <!-- Header -->
  <header class="flex items-center justify-between px-8 py-4 border-b border-white/10 shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight">MediKiosk</span>
    </div>
    <div class="flex items-center gap-2 text-sm text-slate-400">
      <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
      System Online
    </div>
  </header>

  <!-- Progress bar -->
  {% if step %}
  <div class="px-8 pt-3 pb-1 shrink-0">
    <div class="flex gap-1.5">
      {% for i in range(1, total_steps+1) %}
      <div class="h-1.5 flex-1 rounded-full transition-all duration-500 {{ 'bg-sky-500' if i <= step else 'bg-white/10' }}"></div>
      {% endfor %}
    </div>
    <p class="text-xs text-slate-400 mt-1.5">Step {{ step }} of {{ total_steps }} — {{ step_label }}</p>
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="flex-1 overflow-y-auto min-h-0 screen-enter">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="px-8 py-3 border-t border-white/10 text-center shrink-0">
    <p class="text-xs text-slate-500">Your health information is managed by this facility in accordance with HIPAA regulations.</p>
  </footer>
</body>
</html>
